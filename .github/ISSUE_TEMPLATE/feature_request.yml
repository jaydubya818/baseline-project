name: ✨ Feature Request
description: Suggest a new feature or enhancement for the AI Development Toolkit
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide as much detail as possible to help us understand your request.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is your feature request related to a problem?
      placeholder: "I'm frustrated when... / It would be helpful if..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: Describe your proposed solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered
      placeholder: What other approaches have you thought about?

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component would this feature affect?
      options:
        - AI Agents (.claude/agents/)
        - Claude Skills (.claude/skills/)
        - Slash Commands (.claude/commands/)
        - Taskmaster Integration (.taskmaster/)
        - GitHub Workflows (.github/workflows/)
        - Configuration Files
        - Documentation
        - Scripts
        - New Component
        - Other
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - New AI Agent
        - New Claude Skill
        - New Slash Command
        - Enhancement to Existing Feature
        - New Workflow
        - Documentation Improvement
        - Configuration Enhancement
        - Integration with External Tool
        - Other
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Provide concrete examples of how this feature would be used
      placeholder: |
        1. As a developer, I would use this to...
        2. When working on X, this would help by...
        3. Example scenario: ...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Expected Impact
      description: Who would benefit from this feature and how?
      placeholder: |
        - Target users: [e.g., all developers, teams, specific use cases]
        - Benefits: [e.g., saves time, improves quality, enables new workflows]
        - Frequency of use: [e.g., daily, weekly, occasionally]

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical - Blocking my workflow
        - High - Would significantly improve my workflow
        - Medium - Nice to have
        - Low - Minor improvement
    validations:
      required: true

  - type: dropdown
    id: willing-to-contribute
    attributes:
      label: Willing to Contribute
      description: Would you be willing to contribute to implementing this feature?
      options:
        - "Yes, I can implement this"
        - "Yes, I can help with testing"
        - "Yes, I can help with documentation"
        - "Maybe, with guidance"
        - "No, but I can provide feedback"
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: If you have ideas about how to implement this, please share them
      placeholder: Technical approach, files to modify, dependencies needed, etc.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request
      placeholder: Any additional information...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues and discussions to ensure this is not a duplicate
          required: true
        - label: This feature aligns with the project's scope (AI development toolkit)
          required: true
        - label: I have provided clear use cases and expected impact
          required: true
